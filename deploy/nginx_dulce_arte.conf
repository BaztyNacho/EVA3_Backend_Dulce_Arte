# Configuración de Nginx para Dulce Arte (SOLO HTTP).
# Se usa al instalar el servidor y para obtener el primer certificado HTTPS.
# Después se reemplaza por nginx_dulce_arte_https.conf.
# Instalar en: /etc/nginx/sites-available/dulce_arte

server {
    listen 80 default_server;
    server_name _;

    # Fotos de comprobantes tomadas con el celular
    client_max_body_size 10M;

    # Let's Encrypt comprueba que el dominio es nuestro leyendo un archivo de aquí
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /home/ubuntu/dulce-arte/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /home/ubuntu/dulce-arte/media/;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn/dulce_arte.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
