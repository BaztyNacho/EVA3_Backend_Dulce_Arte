# Configuración de Nginx para Dulce Arte.
# Nginx recibe las visitas en el puerto 80, entrega directamente los archivos
# estáticos y subidos, y le pasa el resto a Gunicorn (Django).
# Instalar en: /etc/nginx/sites-available/dulce_arte

server {
    listen 80 default_server;
    server_name _;

    # Fotos de comprobantes tomadas con el celular
    client_max_body_size 10M;

    location /static/ {
        alias /home/ubuntu/dulce-arte/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /home/ubuntu/dulce-arte/media/;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn/dulce_arte.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
