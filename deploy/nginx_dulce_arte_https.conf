# Configuración de Nginx para Dulce Arte CON HTTPS (Let's Encrypt).
# "DOMINIO" se reemplaza por el dominio real al instalar:
#   sed "s/DOMINIO/$DOMINIO/g" deploy/nginx_dulce_arte_https.conf | sudo tee /etc/nginx/sites-available/dulce_arte

# Puerto 80 (HTTP): solo sirve para renovar el certificado; todo lo demás
# se redirige a la versión segura (https) del dominio.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://DOMINIO$request_uri;
    }
}

# Puerto 443 (HTTPS): la aplicación
server {
    listen 443 ssl;
    server_name DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMINIO/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Fotos de comprobantes tomadas con el celular
    client_max_body_size 10M;

    location /static/ {
        alias /home/ubuntu/dulce-arte/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /home/ubuntu/dulce-arte/media/;
    }

    location / {
        proxy_pass http://unix:/run/gunicorn/dulce_arte.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
